services:
  # SkillHub Unified Single Web App (React SPA + Spring Boot Monolith)
  - type: web
    name: skillhub-app
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: skillhub-db
          property: jdbcConnectionString

databases:
  - name: skillhub-db
    databaseName: skillhub
    user: skillhub_user
    plan: free
